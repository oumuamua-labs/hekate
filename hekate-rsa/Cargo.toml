[package]
name = "hekate-rsa"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
authors.workspace = true
repository = "https://github.com/oumuamua-labs/hekate/tree/main/hekate-rsa"
description = "RSA PKCS#1 v1.5 signature statements for the Hekate ZK proving system."
keywords = ["zk", "cryptography", "rsa", "pkcs1", "no-std"]
categories = ["cryptography", "no-std"]
readme = "README.md"

[lib]
crate-type = ["rlib"]

[features]
default = ["std", "parallel", "blake3"]
std = [
    "hekate-core/std",
    "hekate-program/std",
    "hekate-math/std",
    "hekate-gadgets/std",
    "hekate-sha2/std",
]
parallel = ["hekate-gadgets/parallel"]
blake3 = ["hekate-core/blake3", "hekate-gadgets/blake3", "hekate-sha2/blake3"]

[dependencies]
hekate-math = { workspace = true }
hekate-core = { workspace = true }
hekate-program = { workspace = true }
hekate-gadgets = { workspace = true }
hekate-sha2 = { workspace = true }

[dev-dependencies]
hekate-crypto = { workspace = true, features = ["std", "blake3"] }
hekate-verifier = { workspace = true, features = ["std", "blake3"] }
hekate-sdk = { workspace = true, features = ["std", "blake3"] }
hekate-prover-sys = { workspace = true, features = ["blake3", "public"] }
hekate-scribble = { workspace = true, features = ["parallel"] }